name: CI

on:
  pull_request:
  push:
    branches: [main]

# GITHUB_TOKEN needs packages:read to fetch @armachecafe/openapi-client
# from GitHub Packages; without it pnpm fails with
# ERR_PNPM_TARBALL_URL_MISMATCH on fresh installs.
permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin pnpm to 11.5.3 (matches local and packageManager) so pnpm/action-setup@v4
      # never fails with "No pnpm version is specified". Both package.json:packageManager
      # and this version field are required by the action (exact match).
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      # pnpm ignores ${...} auth from the repo-controlled .npmrc, so the
      # GitHub Packages token must live in user-level config for both
      # download and lockfile supply-chain verification.
      - name: Authenticate pnpm to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Contract types gate: src/lib/api.ts imports ../types/api (gitignored,
      # generated by pnpm sync:contract from S3). MUST run before lint/typecheck:
      # without it tsc fails with TS2307 plus cascading TS2339 noise.
      # With AWS creds it syncs real types; without, it creates a CI stub.
      - name: Guard contract types (CI without AWS)
        run: bash scripts/ci-contract-guard.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright mocked tests
        run: pnpm exec playwright test --config=playwright.config.ts
